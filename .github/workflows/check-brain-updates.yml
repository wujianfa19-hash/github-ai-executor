name: Check Brain Updates

on:
  workflow_dispatch:
  schedule:
    # 收件箱事前化 C1 降频（2026-11-06）：每 10 分钟（144 次/天）→ 早晚各一次
    # UTC 1:17,13:17 = 北京 9:17,21:17
    - cron: "17 1,13 * * *"

permissions:
  contents: write

concurrency:
  group: check-brain-updates
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check latest brain commit and update signal file
        env:
          BRAIN_READ_TOKEN: ${{ secrets.PRIVATE_BRAIN_READ_TOKEN }}
          BRAIN_REPO: "wujianfa19-hash/yongjiu-danao"
          SIGNAL_FILE: "sync/brain-check.json"
        run: node "02_程序组件/大脑同步/check-brain-updates.mjs"

      - name: Commit signal file when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- "sync/brain-check.json"; then
            echo "No signal change, nothing to commit"
            exit 0
          fi
          git config user.name "github-ai-executor[bot]"
          git config user.email "41898282+github-ai-executor[bot]@users.noreply.github.com"
          git add "sync/brain-check.json"
          git commit -m "chore(brain-sync): update brain update signal"
          git push origin HEAD:main
          echo "Signal updated and pushed"
