name: Free AI Resource Radar

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "仅测试：不发邮件、不写正式状态、不写报告到仓库"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: free-ai-resource-radar
  cancel-in-progress: false

jobs:
  radar-dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: ${{ inputs.dry_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run unit tests
        run: node --test "02_程序组件/免费AI资源雷达/daily.test.mjs"

      - name: Run radar in DRY-RUN mode (no email, no state write)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: "1"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
        run: node --import "./02_程序组件/共享/free-model-router-adapter.mjs" "02_程序组件/免费AI资源雷达/daily.mjs" --dry-run

  radar-real:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # 仅手动 dispatch 且明确取消 dry_run 时才运行；不挂 schedule
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}

    steps:
      - name: Checkout public executor (code only)
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run unit tests (gate)
        run: node --test "02_程序组件/免费AI资源雷达/daily.test.mjs"

      - name: Verify free-model router can read registry
        run: node --import "./02_程序组件/共享/free-model-router-adapter.mjs" -e "console.log('FREE_MODEL_REGISTRY_ROUTER_OK')"

      - name: Checkout private data repo (least-privilege token)
        uses: actions/checkout@v4
        with:
          repository: wujianfa19-hash/github-ai-daily-intelligence
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .private-data
          fetch-depth: 0

      - name: Run radar (real), read/write data only in private checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          REPORT_RECIPIENT_EMAIL: ${{ secrets.REPORT_RECIPIENT_EMAIL }}
          DATA_DIR: ${{ github.workspace }}/.private-data/02_程序组件/免费AI资源雷达/data
          REPORT_DIR: ${{ github.workspace }}/.private-data/02_程序组件/免费AI资源雷达/reports
        run: node --import "./02_程序组件/共享/free-model-router-adapter.mjs" "02_程序组件/免费AI资源雷达/daily.mjs"

      - name: Write back radar state and reports to private repo (controlled, no force)
        shell: bash
        run: |
          set -euo pipefail
          cd .private-data
          base="02_程序组件/免费AI资源雷达"
          echo "::group::changed files (paths only)"
          git status --porcelain
          echo "::endgroup::"
          allowed_state="$base/data/state.json"
          allowed_dir="$base/reports/"
          bad=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            f="${line:3}"
            case "$f" in
              "$allowed_state"|"$allowed_dir"*) ;;
              *) echo "::error::Disallowed private-repo change: $f"; bad=1 ;;
            esac
          done < <(git status --porcelain=v1 --untracked-files=all)
          if [ "$bad" -ne 0 ]; then
            echo "::error::Unexpected files changed; aborting before commit (nothing pushed)."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$base/data/state.json"
          if [ -d "$base/reports" ]; then git add "$base/reports"; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update free AI resource radar state (via github-ai-executor)"
          git fetch origin main
          if ! git rebase origin/main; then
            echo "::error::Rebase conflict with remote; aborting rebase, no force push."
            git rebase --abort
            exit 1
          fi
          git push origin HEAD:main
          echo "WRITEBACK_OK"
