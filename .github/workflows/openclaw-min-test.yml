name: OpenClaw Cloud Min Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openclaw-min:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Install
        run: npm install -g openclaw@latest --allow-scripts=openclaw

      - name: Version
        run: openclaw --version

      - name: Run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          mkdir -p "$HOME/.openclaw"
          printf '%s\n' \
            '{"gateway":{"mode":"local","port":18789,"auth":{"mode":"token","token":"x"}},' \
            '"agents":{"defaults":{"model":{"primary":"openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"}}},' \
            '"models":{"mode":"merge","providers":{"openrouter":' \
            '{"baseUrl":"https://openrouter.ai/api/v1","apiKey":"${OPENROUTER_API_KEY}",' \
            '"api":"openai-completions","timeoutSeconds":120,"models":[' \
            '{"id":"nvidia/nemotron-3-ultra-550b-a55b:free","name":"n"}]}}}}' \
            > "$HOME/.openclaw/openclaw.json"
          openclaw infer model run --local --json \
            --model openrouter/nvidia/nemotron-3-ultra-550b-a55b:free \
            --prompt "$(cat tests/openclaw-min-input.md)"